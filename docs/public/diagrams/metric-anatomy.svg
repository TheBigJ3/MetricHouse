<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="The parts of a metric declaration">
<title>The parts of a metric declaration</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
  </marker>
</defs>
<rect x="0" y="0" width="900" height="300" rx="14" fill="#f7f9fc" stroke="#dfe5ef"/><text x="450" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2a37" text-anchor="middle">Everything a metric needs to know about itself</text><rect x="60" y="60" width="420" height="200" rx="10" fill="#ffffff" stroke="#c6d0e0" stroke-width="1.5"/><text x="78" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#1f2a37" text-anchor="start">counter('dogs_walked', {</text><text x="78" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#1f2a37" text-anchor="start">  dims: { walker: str(), park: str() },</text><text x="78" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#1f2a37" text-anchor="start">  resolution: '1m',</text><text x="78" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#1f2a37" text-anchor="start">  flush: '5m',</text><text x="78" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#1f2a37" text-anchor="start">  write: async (rows) =&gt; db.insert(rows),</text><text x="78" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#1f2a37" text-anchor="start">})</text><line x1="486" y1="90" x2="524" y2="90" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/><text x="532" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">the name your table and your queries use</text><line x1="486" y1="118" x2="524" y2="118" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/><text x="532" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">the labels you want to break the number down by</text><line x1="486" y1="146" x2="524" y2="146" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/><text x="532" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">how much detail to keep: one row per minute</text><line x1="486" y1="174" x2="524" y2="174" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/><text x="532" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">the fastest this metric may ship</text><line x1="486" y1="202" x2="524" y2="202" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/><text x="532" y="206" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">the function that puts rows in your database</text></svg>
