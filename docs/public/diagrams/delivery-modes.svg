<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Staged delivery and immediate delivery">
<title>Staged delivery and immediate delivery</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
  </marker>
</defs>
<rect x="0" y="0" width="900" height="260" rx="14" fill="#f7f9fc" stroke="#dfe5ef"/><text x="450" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2a37" text-anchor="middle">When rows leave for your database</text><text x="40" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#24459c" text-anchor="start">delivery: 'staged'  (the default)</text><rect x="40" y="84" width="150" height="58" rx="10" fill="#eaf6f0" stroke="#57ab8a" stroke-width="1.5"/><text x="115" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">add()</text><line x1="196" y1="113" x2="240" y2="113" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="246" y="84" width="190" height="58" rx="10" fill="#e9effd" stroke="#5b86f7" stroke-width="1.5"/><text x="341" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#24459c" text-anchor="middle">held in the driver</text><line x1="442" y1="113" x2="500" y2="113" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><text x="471" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">flush()</text><rect x="506" y="84" width="190" height="58" rx="10" fill="#eaf6f0" stroke="#57ab8a" stroke-width="1.5"/><text x="601" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1d6b4f" text-anchor="middle">your write()</text><text x="710" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">one row per bucket</text><text x="40" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#8a5a17" text-anchor="start">delivery: 'immediate'</text><rect x="40" y="192" width="150" height="58" rx="10" fill="#eaf6f0" stroke="#57ab8a" stroke-width="1.5"/><text x="115" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">add()</text><line x1="196" y1="221" x2="240" y2="221" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="246" y="192" width="190" height="58" rx="10" fill="#e9effd" stroke="#5b86f7" stroke-width="1.5"/><text x="341" y="226" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#24459c" text-anchor="middle">held in the driver</text><line x1="442" y1="221" x2="500" y2="221" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><text x="471" y="212" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">at once</text><rect x="506" y="192" width="190" height="58" rx="10" fill="#eaf6f0" stroke="#57ab8a" stroke-width="1.5"/><text x="601" y="226" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1d6b4f" text-anchor="middle">your write()</text><text x="710" y="218" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">the same row is resent</text><text x="710" y="236" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">with a bigger running total</text></svg>
