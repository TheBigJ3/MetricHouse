<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="How data moves through MetricHouse">
<title>How data moves through MetricHouse</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
  </marker>
</defs>
<rect x="0" y="0" width="900" height="260" rx="14" fill="#f7f9fc" stroke="#dfe5ef"/><text x="450" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2a37" text-anchor="middle">One write, from your code to your database</text><rect x="30" y="72" width="170" height="76" rx="10" fill="#eaf6f0" stroke="#57ab8a" stroke-width="1.5"/><text x="115" y="105.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1d6b4f" text-anchor="middle">Your code</text><text x="115" y="124.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">hits.add()</text><line x1="206" y1="110" x2="244" y2="110" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="250" y="72" width="200" height="76" rx="10" fill="#e9effd" stroke="#5b86f7" stroke-width="1.5"/><text x="350" y="105.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#24459c" text-anchor="middle">MetricHouse</text><text x="350" y="124.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">counts and keeps</text><line x1="456" y1="110" x2="494" y2="110" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="500" y="72" width="180" height="76" rx="10" fill="#e9effd" stroke="#5b86f7" stroke-width="1.5"/><text x="590" y="105.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#24459c" text-anchor="middle">Driver</text><text x="590" y="124.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">memory or Redis</text><line x1="686" y1="110" x2="724" y2="110" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="730" y="72" width="140" height="76" rx="10" fill="#eaf6f0" stroke="#57ab8a" stroke-width="1.5"/><text x="800" y="105.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1d6b4f" text-anchor="middle">Your write()</text><text x="800" y="124.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">you wrote this</text><line x1="800" y1="154" x2="800" y2="188" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="700" y="194" width="170" height="54" rx="10" fill="#eaf6f0" stroke="#57ab8a" stroke-width="1.5"/><text x="785" y="226" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1d6b4f" text-anchor="middle">Your database</text><text x="450" y="226" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">MetricHouse owns the middle. Where the rows land is entirely yours.</text><rect x="40" y="238" width="14" height="14" rx="4" fill="#eaf6f0" stroke="#57ab8a" stroke-width="1.5"/><text x="61" y="249" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">you own this</text><rect x="167.2" y="238" width="14" height="14" rx="4" fill="#e9effd" stroke="#5b86f7" stroke-width="1.5"/><text x="188.2" y="249" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">MetricHouse owns this</text></svg>
