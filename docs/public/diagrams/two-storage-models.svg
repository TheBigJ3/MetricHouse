<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="The two ways MetricHouse stores data">
<title>The two ways MetricHouse stores data</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
  </marker>
</defs>
<rect x="0" y="0" width="900" height="300" rx="14" fill="#f7f9fc" stroke="#dfe5ef"/><text x="450" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2a37" text-anchor="middle">Two storage styles</text><text x="30" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#24459c" text-anchor="start">Folded  ·  counter, gauge, timer</text><rect x="30" y="80" width="92" height="46" rx="10" fill="#ffffff" stroke="#c6d0e0" stroke-width="1.5"/><text x="76" y="108" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">+1</text><rect x="130" y="80" width="92" height="46" rx="10" fill="#ffffff" stroke="#c6d0e0" stroke-width="1.5"/><text x="176" y="108" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">+1</text><rect x="230" y="80" width="92" height="46" rx="10" fill="#ffffff" stroke="#c6d0e0" stroke-width="1.5"/><text x="276" y="108" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">+3</text><line x1="332" y1="103" x2="386" y2="103" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><text x="359" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">add up</text><rect x="394" y="74" width="190" height="58" rx="10" fill="#e9effd" stroke="#5b86f7" stroke-width="1.5"/><text x="489" y="98.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#24459c" text-anchor="middle">one number: 5</text><text x="489" y="117.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">per time window</text><text x="600" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">Three writes become one row.</text><text x="600" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">Memory stays flat as traffic grows.</text><line x1="30" y1="160" x2="870" y2="160" stroke="#dfe5ef" stroke-width="1.5"/><text x="30" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#8a5a17" text-anchor="start">Kept whole  ·  event, log</text><rect x="30" y="204" width="92" height="46" rx="10" fill="#ffffff" stroke="#c6d0e0" stroke-width="1.5"/><text x="76" y="232" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">row A</text><rect x="130" y="204" width="92" height="46" rx="10" fill="#ffffff" stroke="#c6d0e0" stroke-width="1.5"/><text x="176" y="232" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">row B</text><rect x="230" y="204" width="92" height="46" rx="10" fill="#ffffff" stroke="#c6d0e0" stroke-width="1.5"/><text x="276" y="232" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">row C</text><line x1="332" y1="227" x2="386" y2="227" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><text x="359" y="218" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">queue</text><rect x="394" y="198" width="190" height="58" rx="10" fill="#fdf1e3" stroke="#d99b4e" stroke-width="1.5"/><text x="489" y="222.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#8a5a17" text-anchor="middle">three rows</text><text x="489" y="241.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">in the order they came</text><text x="600" y="224" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">Nothing is merged, so every</text><text x="600" y="242" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">detail survives to the database.</text></svg>
