<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="How dimensions become rows">
<title>How dimensions become rows</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
  </marker>
</defs>
<rect x="0" y="0" width="900" height="290" rx="14" fill="#f7f9fc" stroke="#dfe5ef"/><text x="450" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2a37" text-anchor="middle">Every combination of dimension values is its own running count</text><rect x="40" y="64" width="250" height="110" rx="10" fill="#e9effd" stroke="#5b86f7" stroke-width="1.5"/><text x="165" y="95.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#24459c" text-anchor="middle">dims</text><text x="165" y="114.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">dogName: str()</text><text x="165" y="133.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">park: str()</text><text x="165" y="152.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">kind: oneOf([...])</text><line x1="296" y1="119" x2="352" y2="119" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="358" y="64" width="230" height="110" rx="10" fill="#ffffff" stroke="#c6d0e0" stroke-width="1.5"/><text x="473" y="95.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2a37" text-anchor="middle">series key</text><text x="473" y="114.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">Willow|riverside|solid</text><text x="473" y="133.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">Willow|riverside|liquid</text><text x="473" y="152.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">Rex|central|solid</text><line x1="594" y1="119" x2="650" y2="119" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="656" y="64" width="210" height="110" rx="10" fill="#eaf6f0" stroke="#57ab8a" stroke-width="1.5"/><text x="761" y="95.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1d6b4f" text-anchor="middle">one row each</text><text x="761" y="114.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">per bucket</text><text x="761" y="133.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">id, bucket_ts,</text><text x="761" y="152.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">dims, value</text><text x="450" y="228" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">Three dog names across two parks and two kinds is up to twelve rows per bucket.</text><text x="450" y="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">Keep dimension values to a small, predictable set. Put anything unique on an event instead.</text></svg>
