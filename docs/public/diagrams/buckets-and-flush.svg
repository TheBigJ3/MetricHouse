" width="38" height="54" rx="6" fill="#ffffff" stroke="#c6d0e0" stroke-width="1.2"/><rect x="440" y="79" width="30" height="41" rx="3" fill="#5b86f7" opacity="0.65"/><rect x="480" y="70" width="38" height="54" rx="6" fill="#ffffff" stroke="#c6d0e0" stroke-width="1.2"/><rect x="484" y="106" width="30" height="14" rx="3" fill="#5b86f7" opacity="0.65"/><rect x="524" y="70" width="38" height="54" rx="6" fill="#ffffff" stroke="#c6d0e0" stroke-width="1.2"/><rect x="528" y="99" width="30" height="21" rx="3" fill="#5b86f7" opacity="0.65"/><rect x="568" y="70" width="38" height="54" rx="6" fill="#ffffff" stroke="#c6d0e0" stroke-width="1.2"/><rect x="572" y="92" width="30" height="28" rx="3" fill="#5b86f7" opacity="0.65"/><rect x="612" y="70" width="38" height="54" rx="6" fill="#ffffff" stroke="#c6d0e0" stroke-width="1.2"/><rect x="616" y="85" width="30" height="35" rx="3" fill="#5b86f7" opacity="0.65"/><rect x="656" y="70" width="38" height="54" rx="6" fill="#ffffff" stroke="#c6d0e0" stroke-width="1.2"/><rect x="660" y="78" width="30" height="42" rx="3" fill="#5b86f7" opacity="0.65"/><rect x="700" y="70" width="38" height="54" rx="6" fill="#ffffff" stroke="#c6d0e0" stroke-width="1.2"/><rect x="704" y="105" width="30" height="15" rx="3" fill="#5b86f7" opacity="0.65"/><rect x="744" y="70" width="38" height="54" rx="6" fill="#ffffff" stroke="#c6d0e0" stroke-width="1.2"/><rect x="748" y="98" width="30" height="22" rx="3" fill="#5b86f7" opacity="0.65"/><rect x="788" y="70" width="38" height="54" rx="6" fill="#ffffff" stroke="#c6d0e0" stroke-width="1.2"/><rect x="792" y="91" width="30" height="29" rx="3" fill="#5b86f7" opacity="0.65"/><line x1="40" y1="136" x2="826" y2="136" stroke="#94a3b8" stroke-width="1.4"/><text x="100" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">one bucket = 1 second</text><text x="756" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">time</text><rect x="40" y="164" width="786" height="44" rx="10" fill="#e9effd" stroke="#5b86f7" stroke-width="1.5" stroke-dasharray="6 4"/><text x="440" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#24459c" text-anchor="middle">one flush every 5 minutes carries all 300 closed buckets at once</text><text x="450" y="246" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">Flushing less often costs freshness. It never costs detail, because every bucket ships.</text></svg>
