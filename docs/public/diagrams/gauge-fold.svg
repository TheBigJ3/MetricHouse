<rect x="0" y="0" width="900" height="250" rx="14" fill="#f7f9fc" stroke="#dfe5ef"/><text x="450" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2a37" text-anchor="middle">Five numbers per bucket, and no average</text><rect x="50" y="70" width="80" height="44" rx="10" fill="#ffffff" stroke="#c6d0e0" stroke-width="1.5"/><text x="90" y="97" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">1284</text><rect x="142" y="70" width="80" height="44" rx="10" fill="#ffffff" stroke="#c6d0e0" stroke-width="1.5"/><text x="182" y="97" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">1301</text><rect x="234" y="70" width="80" height="44" rx="10" fill="#ffffff" stroke="#c6d0e0" stroke-width="1.5"/><text x="274" y="97" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">1297</text><rect x="326" y="70" width="80" height="44" rx="10" fill="#ffffff" stroke="#c6d0e0" stroke-width="1.5"/><text x="366" y="97" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">1266</text><line x1="430" y1="92" x2="486" y2="92" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><text x="458" y="83" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">fold</text><rect x="494" y="64" width="72" height="58" rx="10" fill="#e9effd" stroke="#5b86f7" stroke-width="1.5"/><text x="530" y="88.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#24459c" text-anchor="middle">last</text><text x="530" y="107.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">1266</text><rect x="574" y="64" width="72" height="58" rx="10" fill="#e9effd" stroke="#5b86f7" stroke-width="1.5"/><text x="610" y="88.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#24459c" text-anchor="middle">min</text><text x="610" y="107.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">1266</text><rect x="654" y="64" width="72" height="58" rx="10" fill="#e9effd" stroke="#5b86f7" stroke-width="1.5"/><text x="690" y="88.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#24459c" text-anchor="middle">max</text><text x="690" y="107.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">1301</text><rect x="734" y="64" width="72" height="58" rx="10" fill="#e9effd" stroke="#5b86f7" stroke-width="1.5"/><text x="770" y="88.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#24459c" text-anchor="middle">sum</text><text x="770" y="107.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">5148</text><rect x="814" y="64" width="72" height="58" rx="10" fill="#e9effd" stroke="#5b86f7" stroke-width="1.5"/><text x="850" y="88.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#24459c" text-anchor="middle">count</text><text x="850" y="107.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">4</text><text x="450" y="166" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="middle">average is sum divided by count, so it is one line of SQL rather than a stored column</text><text x="450" y="216" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">These five can be merged across buckets. An average cannot, which is why it is not kept.</text></svg>
