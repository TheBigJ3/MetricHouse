<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Two ways to pump a flush">
<title>Two ways to pump a flush</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
  </marker>
</defs>
<rect x="0" y="0" width="900" height="280" rx="14" fill="#f7f9fc" stroke="#dfe5ef"/><text x="450" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2a37" text-anchor="middle">Who asks the metrics to ship</text><text x="40" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#24459c" text-anchor="start">A server that stays running</text><rect x="40" y="84" width="200" height="62" rx="10" fill="#eaf6f0" stroke="#57ab8a" stroke-width="1.5"/><text x="140" y="110.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1d6b4f" text-anchor="middle">house.start()</text><text x="140" y="129.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">one timer per metric</text><line x1="246" y1="115" x2="300" y2="115" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="306" y="84" width="200" height="62" rx="10" fill="#e9effd" stroke="#5b86f7" stroke-width="1.5"/><text x="406" y="120" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#24459c" text-anchor="middle">ships on its own</text><line x1="512" y1="115" x2="566" y2="115" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="572" y="84" width="250" height="62" rx="10" fill="#eaf6f0" stroke="#57ab8a" stroke-width="1.5"/><text x="697" y="110.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1d6b4f" text-anchor="middle">house.stop() on shutdown</text><text x="697" y="129.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">drains and ships the rest</text><text x="40" y="186" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#8a5a17" text-anchor="start">Serverless or edge, where the process freezes</text><rect x="40" y="200" width="200" height="62" rx="10" fill="#eaf6f0" stroke="#57ab8a" stroke-width="1.5"/><text x="140" y="226.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1d6b4f" text-anchor="middle">a cron or a handler</text><text x="140" y="245.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">every 10 seconds</text><line x1="246" y1="231" x2="300" y2="231" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="306" y="200" width="200" height="62" rx="10" fill="#e9effd" stroke="#5b86f7" stroke-width="1.5"/><text x="406" y="236" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#24459c" text-anchor="middle">house.flush()</text><line x1="512" y1="231" x2="566" y2="231" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="572" y="200" width="250" height="62" rx="10" fill="#eaf6f0" stroke="#57ab8a" stroke-width="1.5"/><text x="697" y="226.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1d6b4f" text-anchor="middle">await house.drain()</text><text x="697" y="245.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">before the response returns</text></svg>
